[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fastapi-template"
version = "0.1.0"
description = "FastAPI microservice template with async SQLAlchemy, PyMongo Async and an idempotency cache"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "aiosqlite==0.22.1",
    "aiomysql==0.3.2",
    "pymongo==4.18.2",
    "click==8.5.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.16.10",
    # Starlette 1.7 builds TestClient on httpx2 (it warns when it falls back to httpx).
    "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "ANN",
    "S",
    "PT",
]

ignore = [
    "ANN401",
    "S101",
    "N818"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true

plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S105",
    "S106",
    "ANN",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
